<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip the coin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <h1 class="title">Flip the coin</h1>
  <h2 class="subtitle">Press the coin or the button to flip the coin</h2>
  <div class="score-board">
    <div class="score-board__item">
      <img class="score-board__icon score-board__icon--head" src="assets/coin-head.png" alt="Head icon">
      <p class="score-board__text">Heads: <span id="heads-score">0</span></p>
    </div>
    <div class="score-board__item">
      <img class="score-board__icon score-board__icon--tail" src="assets/coin-tail.png" alt="Tail icon">
      <p class="score-board__text">Tails: <span id="tails-score">0</span></p>
    </div>
  </div>
  <img class="img--toss" src="assets/toss.png" alt="Coin showing toss illustration">

  <div class="result-container"></div>

  <button class="btn--toss">Toss</button>
</body>

</html>
