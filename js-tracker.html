<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>JS.info Ultimate Tracker</title>
    <style>
      :root {
        --bg: #1e1e1e;
        --card: #252526;
        --text: #d4d4d4;
        --accent: #e8bd17;
        --border: #333;
        --blue: #4fc1ff;
        --green: #4caf50;
      }
      body {
        font-family: sans-serif;
        background: var(--bg);
        color: var(--text);
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .sticky-header {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 15px 0;
        border-bottom: 2px solid var(--border);
        z-index: 100;
      }
      .progress-container {
        margin-bottom: 10px;
      }
      .progress-bar {
        height: 12px;
        background: var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.5s ease;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      button {
        background: var(--border);
        color: white;
        border: none;
        padding: 5px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8em;
      }
      button:hover {
        background: #444;
      }

      .part-section {
        margin-top: 40px;
      }
      .part-title {
        color: var(--accent);
        font-size: 1.8em;
        border-bottom: 1px solid var(--border);
        padding-bottom: 5px;
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      .macro-topic {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 20px;
        padding: 15px;
      }
      .macro-title {
        color: var(--blue);
        font-size: 1.1em;
        font-weight: bold;
        margin-bottom: 12px;
        display: block;
        border-left: 3px solid var(--accent);
        padding-left: 10px;
      }

      .lessons-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 8px;
      }
      .lesson-item {
        display: flex;
        align-items: flex-start;
        padding: 5px;
        border-radius: 4px;
      }
      .lesson-item:hover {
        background: #2d2d30;
      }

      input[type="checkbox"] {
        margin-right: 10px;
        margin-top: 4px;
        transform: scale(1.2);
        accent-color: var(--accent);
        cursor: pointer;
      }
      label {
        cursor: pointer;
        flex: 1;
        font-size: 0.9em;
        line-height: 1.3;
      }
      .stats-text {
        font-size: 0.9em;
        color: #aaa;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="sticky-header">
      <h1 style="margin: 0">JS.info Progress Tracker</h1>
      <div class="progress-container">
        <div class="progress-bar">
          <div id="global-fill" class="fill"></div>
        </div>
        <div class="stats-text">
          Progresso Totale: <span id="global-perc">0</span>% (<span
            id="global-count"
            >0</span
          >
          lezioni)
        </div>
      </div>
      <div class="controls">
        <button onclick="exportData()">💾 Esporta Progressi</button>
        <button onclick="importData()">📂 Importa Progressi</button>
        <button
          onclick="
            if (confirm('Reset totale?')) {
              localStorage.clear();
              location.reload();
            }
          "
        >
          ⚠️ Reset
        </button>
      </div>
    </div>

    <div id="main-content"></div>

    <script>
      const fullSyllabus = [
        {
          part: "Part 1: The JavaScript Language",
          topics: [
            {
              title: "An introduction",
              lessons: [
                "1.1 An Introduction to JavaScript",
                "1.2 Manuals and specifications",
                "1.3 Code editors",
                "1.4 Developer console",
              ],
            },
            {
              title: "JavaScript Fundamentals",
              lessons: [
                "2.1 Hello, world!",
                "2.2 Code structure",
                '2.3 The modern mode, "use strict"',
                "2.4 Variables",
                "2.5 Data types",
                "2.6 Interaction: alert, prompt, confirm",
                "2.7 Type Conversions",
                "2.8 Basic operators, maths",
                "2.9 Comparisons",
                "2.10 Conditional branching: if, '?'",
                "2.11 Logical operators",
                "2.12 Nullish coalescing operator '??'",
                "2.13 Loops: while and for",
                '2.14 The "switch" statement',
                "2.15 Functions",
                "2.16 Function expressions",
                "2.17 Arrow functions, the basics",
                "2.18 JavaScript specials",
              ],
            },
            {
              title: "Code quality",
              lessons: [
                "3.1 Debugging in the browser",
                "3.2 Coding Style",
                "3.3 Comments",
                "3.4 Ninja code",
                "3.5 Automated testing with Mocha",
                "3.6 Polyfills and transpilers",
              ],
            },
            {
              title: "Objects: the basics",
              lessons: [
                "4.1 Objects",
                "4.2 Object references and copying",
                "4.3 Garbage collection",
                '4.4 Object methods, "this"',
                '4.5 Constructor, operator "new"',
                "4.6 Optional chaining '?.'",
                "4.7 Symbol type",
                "4.8 Object to primitive conversion",
              ],
            },
            {
              title: "Data types",
              lessons: [
                "5.1 Methods of primitives",
                "5.2 Numbers",
                "5.3 Strings",
                "5.4 Arrays",
                "5.5 Array methods",
                "5.6 Iterables",
                "5.7 Map and Set",
                "5.8 WeakMap and WeakSet",
                "5.9 Object.keys, values, entries",
                "5.10 Destructuring assignment",
                "5.11 Date and time",
                "5.12 JSON methods, toJSON",
              ],
            },
            {
              title: "Advanced working with functions",
              lessons: [
                "6.1 Recursion and stack",
                "6.2 Rest parameters and spread syntax",
                "6.3 Variable scope, closure",
                '6.4 The old "var"',
                "6.5 Global object",
                "6.6 Function object, NFE",
                '6.7 The "new Function" syntax',
                "6.8 Scheduling: setTimeout and setInterval",
                "6.9 Decorators and forwarding, call/apply",
                "6.10 Function binding",
                "6.11 Arrow functions revisited",
              ],
            },
            {
              title: "Object properties configuration",
              lessons: [
                "7.1 Property flags and descriptors",
                "7.2 Property getters and setters",
              ],
            },
            {
              title: "Prototypes, inheritance",
              lessons: [
                "8.1 Prototypal inheritance",
                "8.2 F.prototype",
                "8.3 Native prototypes",
                "8.4 Prototype methods, objects without __proto__",
              ],
            },
            {
              title: "Classes",
              lessons: [
                "9.1 Class basic syntax",
                "9.2 Class inheritance",
                "9.3 Static properties and methods",
                "9.4 Private and protected properties and methods",
                "9.5 Extending built-in classes",
                '9.6 Class checking: "instanceof"',
                "9.7 Mixins",
              ],
            },
            {
              title: "Error handling",
              lessons: [
                '10.1 Error handling, "try...catch"',
                "10.2 Custom errors, extending Error",
              ],
            },
            {
              title: "Promises, async/await",
              lessons: [
                "11.1 Introduction: callbacks",
                "11.2 Promise",
                "11.3 Promises chaining",
                "11.4 Error handling with promises",
                "11.5 Promise API",
                "11.6 Promisification",
                "11.7 Microtasks",
                "11.8 Async/await",
              ],
            },
            {
              title: "Generators, advanced iteration",
              lessons: [
                "12.1 Generators",
                "12.2 Async iteration and generators",
              ],
            },
            {
              title: "Modules",
              lessons: [
                "13.1 Modules, introduction",
                "13.2 Export and Import",
                "13.3 Dynamic imports",
              ],
            },
            {
              title: "Miscellaneous",
              lessons: [
                "14.1 Proxy and Reflect",
                "14.2 Eval: run a code string",
                "14.3 Currying",
                "14.4 Reference Type",
                "14.5 BigInt",
                "14.6 Unicode, String internals",
                "14.7 WeakRef and FinalizationRegistry",
              ],
            },
          ],
        },
        {
          part: "Part 2: Browser: Document, Events, Interfaces",
          topics: [
            {
              title: "Document",
              lessons: [
                "1.1 Browser environment, specs",
                "1.2 DOM tree",
                "1.3 Walking the DOM",
                "1.4 Searching: getElement*, querySelector*",
                "1.5 Node properties: type, tag and contents",
                "1.6 Attributes and properties",
                "1.7 Modifying the document",
                "1.8 Styles and classes",
                "1.9 Element size and scrolling",
                "1.10 Window sizes and scrolling",
                "1.11 Coordinates",
              ],
            },
            {
              title: "Introduction to Events",
              lessons: [
                "2.1 Introduction to browser events",
                "2.2 Bubbling and capturing",
                "2.3 Event delegation",
                "2.4 Browser default actions",
                "2.5 Dispatching custom events",
              ],
            },
            {
              title: "UI Events",
              lessons: [
                "3.1 Mouse events basics",
                "3.2 Moving: mouseover/out, mouseenter/leave",
                "3.3 Drag'n'Drop with mouse events",
                "3.4 Pointer events",
                "3.5 Keyboard: keydown and keyup",
                "3.6 Scrolling",
              ],
            },
            {
              title: "Forms, controls",
              lessons: [
                "4.1 Form properties and methods",
                "4.2 Focusing: focus/blur",
                "4.3 Events: change, input, cut, copy, paste",
                "4.4 Forms: event and method submit",
              ],
            },
            {
              title: "Document and resource loading",
              lessons: [
                "5.1 Page: DOMContentLoaded, load, beforeunload, unload",
                "5.2 Scripts: async, defer",
                "5.3 Resource loading: onload and onerror",
              ],
            },
            {
              title: "Miscellaneous",
              lessons: [
                "6.1 Mutation observer",
                "6.2 Selection and Range",
                "6.3 Event loop: microtasks and macrotasks",
              ],
            },
          ],
        },
        {
          part: "Part 3: Additional articles",
          topics: [
            {
              title: "Frames and windows",
              lessons: [
                "1.1 Popups and window methods",
                "1.2 Cross-window communication",
                "1.3 The clickjacking attack",
              ],
            },
            {
              title: "Binary data, files",
              lessons: [
                "2.1 ArrayBuffer, binary arrays",
                "2.2 TextDecoder and TextEncoder",
                "2.3 Blob",
                "2.4 File and FileReader",
              ],
            },
            {
              title: "Network requests",
              lessons: [
                "3.1 Fetch",
                "3.2 FormData",
                "3.3 Fetch: Download progress",
                "3.4 Fetch: Abort",
                "3.5 Fetch: Cross-Origin Requests",
                "3.6 Fetch API",
                "3.7 URL objects",
                "3.8 XMLHttpRequest",
                "3.9 Resumable file upload",
                "3.10 Long polling",
                "3.11 WebSocket",
                "3.12 Server Sent Events",
              ],
            },
            {
              title: "Storing data in the browser",
              lessons: [
                "4.1 Cookies, document.cookie",
                "4.2 LocalStorage, sessionStorage",
                "4.3 IndexedDB",
              ],
            },
            {
              title: "Animation",
              lessons: [
                "5.1 Bezier curve",
                "5.2 CSS-animations",
                "5.3 JavaScript animations",
              ],
            },
            {
              title: "Web components",
              lessons: [
                "6.1 From the orbital height",
                "6.2 Custom elements",
                "6.3 Shadow DOM",
                "6.4 Template element",
                "6.5 Shadow DOM slots, composition",
                "6.6 Shadow DOM styling",
                "6.7 Shadow DOM and events",
              ],
            },
            {
              title: "Regular expressions",
              lessons: [
                "7.1 Patterns and flags",
                "7.2 Character classes",
                '7.3 Unicode: flag "u" and class \\p{...}',
                "7.4 Anchors: string start ^ and end $",
                '7.5 Multiline mode of anchors ^ $, flag "m"',
                "7.6 Word boundary: \\b",
                "7.7 Escaping, special characters",
                "7.8 Sets and ranges [...]",
                "7.9 Quantifiers +, *, ? and {n}",
                "7.10 Greedy and lazy quantifiers",
                "7.11 Capturing groups",
                "7.12 Backreferences in pattern: \\N and \\k",
                "7.13 Alternation (OR) |",
                "7.14 Lookahead and lookbehind",
                "7.15 Catastrophic backtracking",
                '7.16 Sticky flag "y", searching at position',
                "7.17 Methods of RegExp and String",
              ],
            },
          ],
        },
      ];

      const storageKey = "JS_INFO_ULTIMATE_TRACKER_DATA";
      let progress = JSON.parse(localStorage.getItem(storageKey)) || {};

      function updateStats() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const checked = Array.from(checkboxes).filter((c) => c.checked).length;
        const total = checkboxes.length;
        const perc = total === 0 ? 0 : Math.round((checked / total) * 100);

        document.getElementById("global-fill").style.width = perc + "%";
        document.getElementById("global-perc").innerText = perc;
        document.getElementById("global-count").innerText =
          `${checked}/${total}`;
      }

      const container = document.getElementById("main-content");
      fullSyllabus.forEach((partData) => {
        const partSection = document.createElement("div");
        partSection.className = "part-section";
        partSection.innerHTML = `<h2 class="part-title">${partData.part}</h2>`;

        partData.topics.forEach((topic) => {
          const macro = document.createElement("div");
          macro.className = "macro-topic";
          macro.innerHTML = `<span class="macro-title">${topic.title}</span>`;

          const grid = document.createElement("div");
          grid.className = "lessons-grid";

          topic.lessons.forEach((lesson) => {
            // Create unique ID based on part and lesson name
            const cleanName = lesson.replace(/[^a-z0-9]/gi, "_").toLowerCase();
            const id = `${partData.part.substring(0, 5)}_${cleanName}`;

            const item = document.createElement("div");
            item.className = "lesson-item";
            const isChecked = progress[id] ? "checked" : "";

            item.innerHTML = `
                    <input type="checkbox" id="${id}" ${isChecked}>
                    <label for="${id}">${lesson}</label>
                `;

            item.querySelector("input").addEventListener("change", (e) => {
              progress[id] = e.target.checked;
              localStorage.setItem(storageKey, JSON.stringify(progress));
              updateStats();
            });
            grid.appendChild(item);
          });
          macro.appendChild(grid);
          partSection.appendChild(macro);
        });
        container.appendChild(partSection);
      });

      function exportData() {
        const blob = new Blob([JSON.stringify(progress)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "js-info-backup.json";
        a.click();
      }

      function importData() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json";
        input.onchange = (e) => {
          const file = e.target.files[0];
          const reader = new FileReader();
          reader.onload = (readerEvent) => {
            try {
              const content = JSON.parse(readerEvent.target.result);
              progress = content;
              localStorage.setItem(storageKey, JSON.stringify(progress));
              location.reload();
            } catch (err) {
              alert("File non valido");
            }
          };
          reader.readAsText(file);
        };
        input.click();
      }

      updateStats();
    </script>
  </body>
</html>
