<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="header">
        <h1 class="title">Frequently Asked Questions</h1>
        <p class="subtitle">Products, Website or Brand Design, we've got you covered!</p>
        <p class="description">Give us your questions, and we can help you achieve our goals together.</p>
    </header>

    <div class="faq-filters">
        <button type="button" class="faq-filters__btn faq-filters__btn--active" data-target="overview">Overview</button>
        <button type="button" class="faq-filters__btn" data-target="design-system">Design System</button>
        <button type="button" class="faq-filters__btn" data-target="brand-design">Brand Design</button>
        <button type="button" class="faq-filters__btn" data-target="develop-website">Develop Website</button>
    </div>

    <div class="faq-panels">
        <section class="faq-panel faq-panel--active" id="overview">
        </section>

        <section class="faq-panel" id="design-system">
        </section>

        <section class="faq-panel" id="brand-design">
        </section>

        <section class="faq-panel" id="develop-website">
        </section>
    </div>
</body>

</html>
